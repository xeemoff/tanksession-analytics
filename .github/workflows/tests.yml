name: Tests and candidate builds
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: windows-2022
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python 3 source
        run: python -m compileall -q src tools tests
      - name: Unit, HTTP and simulated game-client tests
        run: python -m unittest discover -s tests -v
      - name: Simulated delayed result
        run: python tools/simulate_capture.py
      - name: Check UI snapshots against the Python contract
        run: python tools/generate_ui_fixtures.py --check
      - name: Performance smoke test (10k synthetic battles and 30 legacy goals)
        run: python tools/benchmark.py --battles 10000 --goals 30

  hangar-ui:
    name: React / TypeScript / browser preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned UI dependencies
        working-directory: ui
        run: npm ci
      - name: Check TypeScript and presentation transport
        working-directory: ui
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install browser test runtime
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Exercise the actual React UI and capture preview
        working-directory: ui
        run: npm run test:browser
      - name: Package browser preview with prebuilt assets
        run: python tools/package_preview.py
      - name: Upload browser preview and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: tanksession-hangar-preview-${{ github.sha }}
          path: |
            dist/*_Preview.zip
            dist/*_Preview.zip.sha256
            ui/test-results/hangar-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tanksession-ui-test-details-${{ github.sha }}
          path: ui/test-results/
          retention-days: 7

  native-core:
    name: C++23 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            target: linux-x64
            suffix: ''
          - os: windows-2022
            platform: Windows
            target: windows-x64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure C++23 with pinned GoogleTest
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build standalone native engine
        run: cmake --build native/build --config Release --parallel 2
      - name: Core and bounded protocol tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Verify Python parity and actual subprocess adapter
        env:
          TANKSESSION_NATIVE_BINARY: ${{ github.workspace }}/native/build/bin/tanksession-native${{ matrix.suffix }}
        run: python -m unittest discover -s tests -p "test_native_*.py" -v
      - name: Measure core and complete adapter separately
        run: |
          native/build/bin/ts_native_benchmark${{ matrix.suffix }} 100000
          python tools/benchmark_native.py --binary native/build/bin/tanksession-native${{ matrix.suffix }} --sizes 1000 10000 100000 --repeats 3 --json
      - name: Package offline native companion
        run: python tools/package_native.py --binary native/build/bin/tanksession-native${{ matrix.suffix }} --platform ${{ matrix.target }}
      - name: Upload native companion with checksums
        uses: actions/upload-artifact@v4
        with:
          name: tanksession-native-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*_Native_*.zip
            dist/*_Native_*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  native-sanitizers:
    name: C++23 / address and undefined-behaviour checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented native core
        run: cmake -S native -B native/build-sanitized -DCMAKE_BUILD_TYPE=Debug -DTSA_ENABLE_SANITIZERS=ON -DTSA_BUILD_BENCHMARK=OFF
      - name: Build and exercise instrumented code
        run: |
          cmake --build native/build-sanitized --parallel 2
          ctest --test-dir native/build-sanitized --output-on-failure

  python2-build:
    name: CPython 2.7 / reproducible mtmod (game unverified)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the bundled UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build isolated CPython 2.7.18 from official source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Python-2.7.18.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 90 \
            --output "$archive" \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz
          # Official release: https://www.python.org/downloads/release/python-2718/
          # SHA256 cross-checked against pyenv's source manifest:
          # https://github.com/pyenv/pyenv/blob/06fd1ce78890d8f79a0795e0fdfbe9a53916b82e/plugins/python-build/share/python-build/2.7.18
          printf '%s  %s\n' \
            b62c0e7937551d0cc02b8fd5cb0f544f9405bafc9a54d3808ed4594812edef43 \
            "$archive" | sha256sum --check --strict -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/Python-2.7.18"
          ./configure --without-ensurepip --disable-shared > "$RUNNER_TEMP/python27-configure.log" 2>&1 || {
            tail -80 "$RUNNER_TEMP/python27-configure.log"
            exit 1
          }
          make -j2 > "$RUNNER_TEMP/python27-build.log" 2>&1 || {
            tail -100 "$RUNNER_TEMP/python27-build.log"
            exit 1
          }
          printf 'PYTHON2=%s/python\n' "$PWD" >> "$GITHUB_ENV"
      - name: Real Python 2.7 runtime, compilation and reproducibility tests
        run: |
          python -m unittest discover -s tests -p test_build.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_gameface.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_coach.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_workspace.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_insights.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_economy.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_vehicle_identity.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_identity_integration.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_optional_metrics.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_metadata.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_analytics_v2.py -v
          "$PYTHON2" -m unittest discover -s tests -p test_recovery_limits.py -v
      - name: Build candidate and inspect structure
        shell: bash
        run: |
          python tools/build.py --python2 "$PYTHON2"
          python tools/build.py --verify dist/*.mtmod
      - name: Verify package checksum
        shell: bash
        working-directory: dist
        run: sha256sum --check --strict *.sha256
      - name: Package the Windows installation candidate
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from build import project_metadata
          from package_release import build_release
          if '-' in project_metadata()[1]:
              bundle, info = build_release()
              print('Windows candidate:', bundle)
              print('SHA-256:', info['archive_sha256'])
          else:
              print('Stable Windows bundle is prepared by the gated release workflow.')
          PY
      - name: Upload test candidate (not a validated game release)
        uses: actions/upload-artifact@v4
        with:
          name: tanksession-mtmod-candidate-${{ github.sha }}
          path: |
            dist/*.mtmod
            dist/*.sha256
            dist/*_Windows.zip
          if-no-files-found: error
          retention-days: 14
