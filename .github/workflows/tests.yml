name: Unit tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python 3 source (does not validate Python 2.7)
        run: python -m compileall -q src tools tests
      - name: Unit and simulated game-client tests
        run: python -m unittest discover -s tests -v
      - name: Simulated delayed result
        run: python tools/simulate_capture.py
      - name: Performance smoke test (10k synthetic battles)
        run: python tools/benchmark.py --battles 10000
