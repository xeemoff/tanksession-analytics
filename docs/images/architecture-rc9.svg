<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Архитектура TankSession Analytics</title><desc id="desc">Игровые события и опциональный кэш поступают в Python-адаптер. Проверенные собственные результаты записываются в журнал JSONL, превращаются в снимок статистики и выводятся в React-интерфейс через Gameface или локальный браузерный просмотр.</desc>
